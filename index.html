<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#030305">
    <title>Arcatdia Battle Engine - 三層視覺版</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="stage-container">
    <!-- 🖼️ 戰鬥最底層：Canvas -->
    <canvas id="battleCanvas"></canvas>

    <!-- 🌌 第二層：候機室專屬背景 -->
    <div id="readyBg" class="bg-layer theme-ready"></div>

    <!-- 🚀 第三層：開頭封面專屬背景 -->
    <div id="titleBg" class="bg-layer theme-title active"></div>

    <!-- 🛡️ 第四層：戰鬥專用玻璃遮罩 -->
    <div id="battleGlassMask" class="battle-glass-overlay"></div>

    <!-- 戰鬥頂部 HUD -->
    <div class="hud-overlay" id="battleHud" style="display:none;">
        <div class="hud-left">
            <div class="brand-mini">ARCATDIA</div>
            <div class="track-info" id="hudTrackInfo">最大の愛</div>
        </div>
        <div class="score-board"><span id="scoreVal">000000</span></div>
        <div class="hud-right">
            <button id="pauseBtn" class="btn-pause" onclick="pauseGame()">⏸ 暫停</button>
        </div>
        <div class="hp-bar-line"><div id="hpFill" class="hp-fill"></div></div>
    </div>

    <div id="judgementDisplay">PERFECT!</div>
    <div id="comboDisplay">0 COMBO</div>

    <!-- 🎯 四軌觸控底座 -->
    <div class="touch-controller" id="touchController" style="display:none;">
        <div class="touch-lane" id="lane0"><span>L1</span></div>
        <div class="touch-lane" id="lane1"><span>L2</span></div>
        <div class="touch-lane" id="lane2"><span>R1</span></div>
        <div class="touch-lane" id="lane3"><span>R2</span></div>
    </div>

    <!-- 🎯 畫面一：封面 Title Screen (已移除玻璃層，相片完全顯示) -->
    <div id="titleScreen" class="overlay-modal active">
        <button class="btn-drawer-toggle" onclick="toggleWallpaperDrawer()">🎨 相簿與設定</button>
        <div class="title-content" onclick="goToReadyRoom()">
            <h1 class="game-logo">ARCATDIA</h1>
            <p class="logo-sub">~ 三層視覺 獨立相簿測試版 ~</p>
            <div class="tap-start-hint">✨ 點擊螢幕進入航行整備室 ✨</div>
        </div>
    </div>

    <!-- 🎯 畫面二：出發準備室 (已移除玻璃層，相片完全顯示) -->
    <div id="readyRoom" class="overlay-modal">
        <button class="btn-drawer-toggle" onclick="toggleWallpaperDrawer()">🎨 相簿與設定</button>
        <h2 class="room-title" style="text-shadow: 0 0 10px #000;">🚀 航行整備室</h2>
        <div class="ready-panel glass-card">
            <div class="setting-group">
                <label>選擇航行難度：</label>
                <div class="option-row">
                    <button class="opt-btn diff-btn active" id="btnDiffEasy" onclick="selectDifficulty('easy')">🌱 EASY</button>
                    <button class="opt-btn diff-btn" id="btnDiffNormal" onclick="selectDifficulty('normal')">🔥 NORMAL</button>
                    <button class="opt-btn diff-btn" id="btnDiffTest" onclick="selectDifficulty('test')">🛠️ TEST</button>
                </div>
            </div>
            <button class="launch-btn" onclick="startVoyage()">✨ 啟程前往阿卡迪亞貓星 ✨</button>
            <button class="return-btn" onclick="returnToTitle()">🔙 返回開頭封面</button>
        </div>
    </div>

    <!-- 🎯 隨身抽屜 -->
    <div id="wallpaperDrawer" class="drawer-modal">
        <div class="drawer-header">
            <h3>🎨 視覺與相簿設定</h3>
            <button class="btn-close-drawer" onclick="toggleWallpaperDrawer()">✕</button>
        </div>
        <div class="drawer-body">
            <label>1️⃣ 開頭封面 (原相 Fit to Page)：</label>
            <label class="custom-upload-btn">
                📁 選擇封面圖...
                <input type="file" accept="image/*" onchange="handleUpload(event, 'title')" style="display:none;">
            </label>

            <label style="margin-top: 10px;">2️⃣ 候機室 (原相 Fit to Page)：</label>
            <label class="custom-upload-btn" style="border-color:#ccff00;">
                📁 選擇候機室壁紙...
                <input type="file" accept="image/*" onchange="handleUpload(event, 'ready')" style="display:none;">
            </label>

            <label style="margin-top: 10px;">3️⃣ 戰鬥幻燈片 (多張, 每5.5s輪播)：</label>
            <label class="custom-upload-btn" style="border-color:#ff0055;">
                📁 選擇多張樂隊相片...
                <input type="file" accept="image/*" multiple onchange="handleUpload(event, 'battle')" style="display:none;">
            </label>

            <label style="margin-top: 15px;">🌗 戰鬥幻燈片透明度 (0 - 100)：</label>
            <input type="range" id="opacitySlider" class="custom-slider" min="0" max="100" value="45" oninput="updateSlideOpacity(this.value)">

            <button class="save-btn" onclick="saveSettings()">💾 SAVE 設定</button>
        </div>
    </div>

    <!-- 🎯 戰鬥暫停選單 (保留玻璃層) -->
    <div id="pauseMenu" class="overlay-modal glass-panel">
        <div class="pause-card glass-card">
            <h2>⏸ 遊戲暫停中</h2>
            <button class="pause-opt-btn" onclick="resumeGame()">▶ 繼續戰鬥</button>
            <button class="pause-opt-btn" onclick="restartFromPause()">🔄 重新開始</button>
            <button class="pause-opt-btn btn-exit" onclick="returnToReadyRoom()">🚪 退回航行整備室</button>
        </div>
    </div>
</div>

<script src="app.js"></script>
</body>
</html>
