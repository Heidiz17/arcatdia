<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#030305">
    <title>Arcatdia Battle Engine</title>

    <!-- 🐾 引入阿豬媽煲同款：Zen Maru Gothic -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="stage-container">
    <!-- 頂部 HUD -->
    <div class="hud-overlay">
        <div class="track-info" id="hudTrackInfo">最大の愛</div>
        <div class="hp-bar-container"><div id="hpFill" class="hp-fill"></div></div>
        <div class="score-board"><span id="scoreVal">000000</span></div>

        <div class="hud-buttons">
            <button id="restartToggleBtn" class="btn-panel" style="border-color:#ffaa00; color:#ffaa00;" onclick="restartSong()">🔄 重玩</button>
            <button id="lineToggleBtn" class="btn-panel" style="border-color:#ccff00; color:#ccff00;" onclick="toggleJudgeLineLevel()">🎯 調線位</button>
            <button id="modeToggleBtn" class="btn-panel" onclick="togglePerspectiveMode()">🚀 3D 梯形</button>
            <button id="speedToggleBtn" class="btn-panel" onclick="toggleSpeedButton()">🚀 1.0x</button>
            <button id="mainPlayBtn" class="btn-panel" style="border-color:#ff0077; color:#ff0077;" onclick="togglePlay()">⏸ PAUSE</button>
        </div>
    </div>

    <div id="judgementDisplay">PERFECT!</div>
    <div id="comboDisplay">0 COMBO</div>

    <canvas id="battleCanvas"></canvas>

    <!-- 橫屏四軌觸控區 -->
    <div class="touch-controller">
        <div class="touch-lane" id="lane0">L1</div>
        <div class="touch-lane" id="lane1">L2</div>
        <div class="touch-lane" id="lane2">R1</div>
        <div class="touch-lane" id="lane3">R2</div>
    </div>

    <!-- 🎯 畫面一：封面 Title -->
    <div id="titleScreen" class="overlay-modal active" onclick="goToReadyRoom()">
        <h1 class="game-logo">ARCATDIA</h1>
        <p class="logo-sub">~ 阿卡迪亞星際航程 ~</p>
        <div class="tap-start-hint">✨ 點擊螢幕進入準備室 ✨</div>
    </div>

    <!-- 🎯 畫面二：出發準備室 (Ready Room) -->
    <div id="readyRoom" class="overlay-modal">
        <h2 class="room-title">🚀 航行整備室</h2>
        <div class="ready-panel">
            <!-- 難度選擇 -->
            <div class="setting-group">
                <label>選擇航行難度：</label>
                <div class="option-row">
                    <button class="opt-btn diff-btn active" id="btnDiffEasy" onclick="selectDifficulty('easy')">🌱 EASY (慢悠)</button>
                    <button class="opt-btn diff-btn" id="btnDiffNormal" onclick="selectDifficulty('normal')">🔥 NORMAL (連動)</button>
                    <button class="opt-btn diff-btn" id="btnDiffTest" onclick="selectDifficulty('test')">🛠️ 測試場</button>
                </div>
            </div>

            <!-- 視角與流速設定 -->
            <div class="setting-group">
                <label>操作偏好設定：</label>
                <div class="option-row">
                    <button class="opt-btn" id="btnRoomPersp" onclick="toggleRoomPerspective()">視角: 🚀 3D 梯形 (初音式)</button>
                    <button class="opt-btn" id="btnRoomSpeed" onclick="toggleRoomSpeed()">音符流速: 1.0x</button>
                </div>
            </div>

            <!-- 出發大掣 -->
            <button class="launch-btn" onclick="startVoyage()">✨ 啟程前往阿卡迪亞貓星 ✨</button>
        </div>
    </div>
</div>

<script src="app.js"></script>
<script>
    // 介面流轉邏輯
    let selectedMode = 'easy';

    function goToReadyRoom() {
        document.getElementById('titleScreen').classList.remove('active');
        document.getElementById('readyRoom').classList.add('active');
        initDSP(); // 提前激活音頻
    }

    function selectDifficulty(mode) {
        selectedMode = mode;
        document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('active'));
        if (mode === 'easy') document.getElementById('btnDiffEasy').classList.add('active');
        if (mode === 'normal') document.getElementById('btnDiffNormal').classList.add('active');
        if (mode === 'test') document.getElementById('btnDiffTest').classList.add('active');
    }

    function toggleRoomPerspective() {
        togglePerspectiveMode();
        document.getElementById('btnRoomPersp').innerText = currentPerspectiveMode === 2 ? "視角: 🚀 3D 梯形 (初音式)" : "視角: 🏊 2D 平行直軌";
    }

    function toggleRoomSpeed() {
        toggleSpeedButton();
        document.getElementById('btnRoomSpeed').innerText = `音符流速: ${scrollSpeedMultiplier.toFixed(1)}x`;
    }

    function startVoyage() {
        document.getElementById('readyRoom').classList.remove('active');
        chooseDifficultyAndStart(selectedMode);
    }
</script>
</body>
</html>
