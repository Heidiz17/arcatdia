<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Arcatdia Battle Engine</title>
    <link rel="stylesheet" href="style.css">
    <!-- Tonejs / Midi 解析庫 -->
    <script src="https://cdn.jsdelivr.net/npm/@tonejs/midi@2.0.28/dist/Midi.min.js"></script>
</head>
<body>
    <!-- 封面畫面 -->
    <div id="titleBg" class="bg-layer active"></div>
    <div id="titleScreen" class="screen-layer active">
        <h1 class="game-title">ARCATDIA</h1>
        <p class="subtitle">HEI'DIZAI & P-CHAN</p>
        <button class="menu-btn main-start" onclick="goToReadyRoom()">進入候機室</button>
    </div>

    <!-- 候機室畫面 -->
    <div id="readyBg" class="bg-layer"></div>
    <div id="readyRoom" class="screen-layer">
        <div class="ready-panel">
            <h2 class="panel-title">候機室 (READY ROOM)</h2>
            <div class="diff-selection">
                <button id="btnDiffEasy" class="diff-btn" onclick="selectDifficulty('easy')">EASY</button>
                <button id="btnDiffNormal" class="diff-btn" onclick="selectDifficulty('normal')">NORMAL</button>
                <button id="btnDiffTest" class="diff-btn active" onclick="selectDifficulty('test')">TEST (拍子機)</button>
            </div>

            <div class="action-buttons">
                <button class="menu-btn primary" onclick="startVoyage()">🚀 出發戰鬥！</button>
                <button id="toggleDrawerBtn" class="menu-btn secondary">⚙️ 整備工具箱 (入歌/改BPM) ▼</button>
                <button class="menu-btn return" onclick="returnToTitle()">返回封面</button>
            </div>

            <!-- 工具箱抽屜 -->
            <div id="readyRoomDrawer" class="drawer-box" style="display: none;">
                <div class="tool-group">
                    <label>BPM 調整：</label>
                    <input type="number" id="manualBpmInput" value="175" min="40" max="300">
                </div>
                <div class="tool-group">
                    <label>匯入音訊 (WAV/MP3)：</label>
                    <input type="file" id="dualWavInput" accept="audio/*">
                    <span id="wavStatus" class="status-tip">預設: 最大の愛</span>
                </div>
                <div class="tool-group">
                    <label>匯入譜面 (MIDI/JSON)：</label>
                    <input type="file" id="dualMidiInput" accept=".mid,.midi,.json">
                    <span id="midiStatus" class="status-tip">未載入</span>
                </div>
                <div class="tool-group">
                    <label>戰鬥背景透明度：</label>
                    <input type="range" id="opacitySlider" min="0" max="100" value="100" oninput="updateSlideOpacity(this.value)">
                </div>
                <div class="tool-group">
                    <button class="btn-sub" onclick="saveSettings()">💾 儲存所有設定</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 戰鬥準備轉場 -->
    <div id="introScreen" class="intro-layer">
        <div id="introCoverBox" class="intro-cover"></div>
        <div id="introDifficultyText" class="intro-diff">DIFFICULTY: TEST</div>
        <div id="introReadyText" class="intro-ready">READY...</div>
    </div>

    <!-- 戰鬥主畫布 -->
    <canvas id="battleCanvas"></canvas>

    <!-- 戰鬥頂部 HUD -->
    <div id="battleHud" style="display: none;">
        <div class="hud-left">
            <div class="hud-tag">ARCATDIA</div>
            <div class="hud-song-title">最大の愛</div>
            <div class="hp-bar-container">
                <div id="hpFill" class="hp-fill"></div>
            </div>
        </div>
        <div class="hud-center">
            <div id="scoreVal" class="score-number">000000</div>
        </div>
        <div class="hud-right" style="display: flex; align-items: center; gap: 6px;">
            <!-- 🎯 新增右上角直接換判定線按鈕 -->
            <button id="btnQuickJudgeLine" onclick="toggleJudgeLineLevel()" style="background: rgba(0, 255, 204, 0.15); border: 1px solid #00ffcc; color: #00ffcc; font-size: 11px; padding: 5px 8px; border-radius: 4px; cursor: pointer; backdrop-filter: blur(4px);">
                📏 線: LV2
            </button>
            <button id="btnPause" onclick="pauseGame()" class="pause-btn">⏸ 暫停</button>
        </div>
    </div>

    <!-- 戰鬥中間浮動反饋 -->
    <div id="comboDisplay" class="combo-text"></div>
    <div id="judgementDisplay" class="judge-text"></div>

    <!-- 觸控底板按鈕 -->
    <div id="touchController" style="display: none;">
        <div id="lane0" class="touch-lane"></div>
        <div id="lane1" class="touch-lane"></div>
        <div id="lane2" class="touch-lane"></div>
        <div id="lane3" class="touch-lane"></div>
    </div>

    <!-- 暫停選單 -->
    <div id="pauseMenu" class="pause-layer">
        <div class="pause-box">
            <h2>遊戲暫停</h2>
            <button class="menu-btn primary" onclick="resumeGame()">繼續戰鬥</button>
            <button class="menu-btn secondary" onclick="restartFromPause()">重新開始</button>
            <button class="menu-btn return" onclick="returnToReadyRoom()">返回候機室</button>
        </div>
    </div>

    <!-- 結算畫面 -->
    <div id="resultModal" class="result-layer">
        <div class="result-box">
            <div id="rankBadge" class="rank-badge">S</div>
            <h2 class="result-title">STAGE CLEAR</h2>
            <div class="result-score" id="resScore">000000</div>
            <div class="stat-grid">
                <div>MAX COMBO: <span id="resMaxCombo">0</span></div>
                <div>PERFECT: <span id="resPerfect">0</span></div>
                <div>GREAT: <span id="resGreat">0</span></div>
                <div>GOOD: <span id="resGood">0</span></div>
                <div>MISS: <span id="resMiss">0</span></div>
            </div>
            <div id="closeCountdown" class="result-hint">點擊任意位置繼續</div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
