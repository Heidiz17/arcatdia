<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#030305">
    <title>Arcatdia Battle Engine - 3D 消失點版</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="stage-container">
    <canvas id="battleCanvas"></canvas>

    <!-- 🌌 封面與候機室背景 -->
    <div id="readyBg" class="bg-layer theme-ready" style="filter:none; transition:opacity 0.4s; pointer-events:none;"></div>
    <div id="titleBg" class="bg-layer theme-title active" style="filter:none; transition:opacity 0.4s; pointer-events:none;"></div>

    <!-- 戰鬥頂部 HUD -->
    <div class="hud-overlay" id="battleHud" style="display:none;">
        <div class="hud-left">
            <div class="brand-mini">ARCATDIA</div>
            <div class="track-info" id="hudTrackInfo">最大の愛</div>
        </div>
        <div class="score-board"><span id="scoreVal">000000</span></div>
        <div class="hud-right">
            <button id="pauseBtn" class="btn-pause" onclick="pauseGame()">⏸ 暫停</button>
        </div>
        <div class="hp-bar-line"><div id="hpFill" class="hp-fill lvl-s"></div></div>
    </div>

    <div id="judgementDisplay">PERFECT!</div>
    <div id="comboDisplay">0 COMBO</div>

    <div class="touch-controller" id="touchController" style="display:none;">
        <div class="touch-lane" id="lane0"><span>L1</span></div>
        <div class="touch-lane" id="lane1"><span>L2</span></div>
        <div class="touch-lane" id="lane2"><span>R1</span></div>
        <div class="touch-lane" id="lane3"><span>R2</span></div>
    </div>

    <!-- ================= 畫面一：封面 Title Screen ================= -->
    <div id="titleScreen" class="overlay-modal active">
        <!-- 🎯 物理破解入相掣 1 -->
        <div style="position:absolute; top:15px; right:15px; z-index:100; border:1px solid #00ffcc; border-radius:6px; background:rgba(0,0,0,0.6); overflow:hidden;">
            <div style="padding:6px 10px; font-size:10px; color:#fff; pointer-events:none;">📁 封面圖</div>
            <input type="file" accept="image/*" onchange="handleUpload(event, 'title')" style="position:absolute; top:0; left:0; width:100%; height:100%; opacity:0; cursor:pointer;">
        </div>

        <div class="title-content" style="background:transparent; box-shadow:none; backdrop-filter:none;">
            <h1 class="game-logo" onclick="goToReadyRoom()">ARCATDIA</h1>
            <p class="logo-sub blink-text" onclick="goToReadyRoom()" style="font-size: 16px; margin-top: 15px; color: #ffcc00; text-shadow: 0 0 10px rgba(255,170,0,0.9);">進入：阿卡迪亞 ~貓星宇宙🪐</p>
        </div>
    </div>

    <!-- ================= 畫面二：出發準備室 ================= -->
    <div id="readyRoom" class="overlay-modal">
        <!-- 🎯 物理破解入相掣 2 -->
        <div style="position:absolute; top:15px; right:15px; z-index:100; border:1px solid #ccff00; border-radius:6px; background:rgba(0,0,0,0.6); overflow:hidden;">
            <div style="padding:6px 10px; font-size:10px; color:#fff; pointer-events:none;">📁 候機室</div>
            <input type="file" accept="image/*" onchange="handleUpload(event, 'ready')" style="position:absolute; top:0; left:0; width:100%; height:100%; opacity:0; cursor:pointer;">
        </div>

        <h2 class="room-title">🚀 航行整備室</h2>
        <div class="ready-panel glass-card" style="background: rgba(0, 0, 0, 0.4); backdrop-filter: none;">
            <div class="setting-group">
                <label style="text-shadow: 1px 1px 3px #000;">選擇航行難度：</label>
                <div class="option-row">
                    <button class="opt-btn diff-btn active" id="btnDiffEasy" onclick="selectDifficulty('easy')">🌱 EASY</button>
                    <button class="opt-btn diff-btn" id="btnDiffNormal" onclick="selectDifficulty('normal')">🔥 NORMAL</button>
                    <button class="opt-btn diff-btn" id="btnDiffTest" onclick="selectDifficulty('test')">🛠️ TEST (L1單軌)</button>
                </div>
            </div>
            <button class="launch-btn" onclick="startVoyage()">✨ 啟程前往阿卡迪亞貓星 ✨</button>
            <button class="return-btn" onclick="returnToTitle()" style="background:rgba(0,0,0,0.5);">🔙 返回開頭封面</button>
        </div>
    </div>

    <!-- ================= 畫面三：戰鬥暫停選單 ================= -->
    <div id="pauseMenu" class="overlay-modal glass-panel">
        <div class="pause-card glass-card">
            <h2>⏸ 遊戲暫停中</h2>

            <div class="slider-group">
                <div class="slider-label-row"><span>🎵 BGM 歌曲音量</span><span id="valBgm">100%</span></div>
                <input type="range" id="bgmSlider" class="custom-slider" min="0" max="1" step="0.05" value="1.0" oninput="updateBgmVolume(this.value)">
            </div>
            <div class="slider-group">
                <div class="slider-label-row"><span>🥁 SFX 打擊音量</span><span id="valSfx">100%</span></div>
                <input type="range" id="sfxSlider" class="custom-slider" min="0" max="1" step="0.05" value="1.0" oninput="updateSfxVolume(this.value)">
            </div>

            <div style="background:rgba(0,0,0,0.5); padding:8px; border-radius:8px; border:1px dashed #ff0077;">
                <!-- 🎯 物理破解入相掣 3 -->
                <div style="position:relative; overflow:hidden; background:rgba(255,0,119,0.3); border:1px solid #ff0077; border-radius:5px; margin-bottom:8px;">
                    <div style="padding:6px; font-size:10px; color:#fff; pointer-events:none;">📁 戰鬥幻燈片 (可選多張)</div>
                    <input type="file" accept="image/*" multiple onchange="handleUpload(event, 'battle')" style="position:absolute; top:0; left:0; width:100%; height:100%; opacity:0; cursor:pointer;">
                </div>

                <div style="text-align: left; font-size: 10px; color: #aaa; margin-bottom:3px;">🌗 戰鬥圖亮度控制：</div>
                <input type="range" id="opacitySlider" class="custom-slider" min="0" max="100" value="100" oninput="updateSlideOpacity(this.value)">
                <button onclick="saveSettings()" style="width:100%; font-size:11px; padding:6px; background:#00ffcc; color:#000; border:none; border-radius:5px; font-weight:900; cursor:pointer; margin-top:6px;">
                    💾 SAVE (儲存所有相片及設定)
                </button>
            </div>
            
            <div style="display: flex; gap: 6px;">
                <button class="pause-opt-btn" onclick="togglePerspectiveMode()" style="flex:1; background:#aa00ff; color:#fff; border-color:#aa00ff;">📐 2D / 3D</button>
                <button class="pause-opt-btn" onclick="toggleJudgeLineLevel()" style="flex:1; background:#00ccff; color:#000; border-color:#00ccff;">🎯 判定線</button>
            </div>

            <button class="pause-opt-btn" onclick="resumeGame()">▶ 繼續戰鬥</button>
            <button class="pause-opt-btn" onclick="restartFromPause()">🔄 重新開始</button>
            <button class="pause-opt-btn btn-exit" onclick="returnToReadyRoom()">🚪 退回航行整備室</button>
        </div>
    </div>
</div>

<script src="app.js"></script>
</body>
</html>
