<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#030305">
    
    <!-- 🎯 引入 PWA 身分證，啟動純全螢幕無網址列模式 -->
    <link rel="manifest" href="manifest.json">
    
    <title>Arcatdia Whole Note Lab</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="stage-container">
    <div class="hud-overlay">
        <div class="track-info">01_最大的愛 (全音符校準)</div>
        
        <div class="hp-bar-container">
            <div id="hpFill" class="hp-fill"></div>
        </div>

        <div class="score-board"><span id="scoreVal">000000</span></div>

        <div class="hud-buttons">
            <button id="lineToggleBtn" class="btn-panel" style="border-color:#ccff00; color:#ccff00;" onclick="toggleJudgeLineLevel()">🎯 調線位</button>
            <button id="modeToggleBtn" class="btn-panel" onclick="togglePerspectiveMode()">🏊 2D 直軌</button>
            <button id="speedToggleBtn" class="btn-panel" onclick="togglePlaybackSpeed()">🎵 0.8x</button>
            <button id="mainPlayBtn" class="btn-panel" style="border-color:#ff0077; color:#ff0077;" onclick="togglePlay()">▶ PLAY</button>
        </div>
    </div>

    <div id="judgementDisplay">PERFECT!</div>
    <div id="comboDisplay">0 COMBO</div>

    <canvas id="battleCanvas"></canvas>

    <div class="touch-controller">
        <div class="touch-lane" id="lane0">L1</div>
        <div class="touch-lane" id="lane1">L2</div>
        <div class="touch-lane" id="lane2">R1</div>
        <div class="touch-lane" id="lane3">R2</div>
    </div>

    <div id="startMask" class="start-mask">
        <h2 class="title-text">ARCATDIA WHOLE NOTE LAB</h2>
        <p class="sub-text">175 BPM | 4拍整數下落 | 第一拍精準撞線</p>
        <button class="btn-start" onclick="startCalibration()">🎵 進入全音符校準場</button>
    </div>
</div>

<script src="app.js"></script>
</body>
</html>
