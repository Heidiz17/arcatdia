<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- 🎯 全螢幕 PWA 標籤，縮埋手機網址列 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Arcatdia Rhythm Engine - Fullscreen Edition</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="stage-container">
    <!-- 頂部 HUD 資訊 -->
    <div class="hud-overlay">
        <div class="track-info">01_最大的愛</div>
        
        <div class="hp-bar-container">
            <div id="hpFill" class="hp-fill"></div>
        </div>

        <div class="score-board"><span id="scoreVal">000000</span></div>

        <div class="hud-buttons">
            <button id="modeToggleBtn" class="btn-panel" onclick="togglePerspectiveMode()">🚀 3D 尖角</button>
            <button id="speedToggleBtn" class="btn-panel" onclick="toggleNoteSpeed()">⚡ 6.0x</button>
            <button id="mainPlayBtn" class="btn-panel" style="border-color:#ff0077; color:#ff0077;" onclick="togglePlay()">▶ PLAY</button>
        </div>
    </div>

    <div id="judgementDisplay">PERFECT!</div>
    <div id="comboDisplay">0 COMBO</div>

    <canvas id="battleCanvas"></canvas>

    <!-- 下方加大好撳嘅 4 軌按鈕 -->
    <div class="touch-controller">
        <div class="touch-lane" id="lane0">L1</div>
        <div class="touch-lane" id="lane1">L2</div>
        <div class="touch-lane" id="lane2">R1</div>
        <div class="touch-lane" id="lane3">R2</div>
    </div>

    <div id="startMask" class="start-mask">
        <h2 class="title-text">ARCATDIA BATTLE ENGINE</h2>
        <p class="sub-text">175 BPM J-Rock | 橫屏極致全螢幕版</p>
        <button class="btn-start" onclick="startBattle()">▶ 啟動同步戰鬥 (全螢幕)</button>
    </div>
</div>

<script src="app.js"></script>
</body>
</html>
