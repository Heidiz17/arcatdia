<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#030305">
    <title>Arcatdia Battle Engine - 最終幻燈片版</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="stage-container">
    <!-- 🌌 動態壁紙全域層（支援自選相簿幻燈片） -->
    <div id="bgWallpaper" class="wallpaper-bg theme-nebula"></div>
    <!-- 🛡️ 戰鬥磨砂黑曜石夾心遮罩 -->
    <div id="battleGlassMask" class="battle-glass-overlay"></div>

    <!-- 戰鬥頂部 HUD -->
    <div class="hud-overlay" id="battleHud" style="display:none;">
        <div class="hud-left">
            <div class="brand-mini">ARCATDIA</div>
            <div class="track-info" id="hudTrackInfo">最大の愛</div>
        </div>
        <div class="score-board"><span id="scoreVal">000000</span></div>
        <div class="hud-right">
            <button id="pauseBtn" class="btn-pause" onclick="pauseGame()">⏸ 暫停</button>
        </div>
        <div class="hp-bar-line"><div id="hpFill" class="hp-fill"></div></div>
    </div>

    <div id="judgementDisplay">PERFECT!</div>
    <div id="comboDisplay">0 COMBO</div>

    <canvas id="battleCanvas"></canvas>

    <!-- 🎯 四軌觸控底座 -->
    <div class="touch-controller" id="touchController" style="display:none;">
        <div class="touch-lane" id="lane0"><span>L1</span></div>
        <div class="touch-lane" id="lane1"><span>L2</span></div>
        <div class="touch-lane" id="lane2"><span>R1</span></div>
        <div class="touch-lane" id="lane3"><span>R2</span></div>
    </div>

    <!-- 🎯 畫面一：封面 Title Screen -->
    <div id="titleScreen" class="overlay-modal glass-panel active">
        <button class="btn-drawer-toggle" onclick="toggleWallpaperDrawer()">🎨 相簿與設定</button>

        <div class="title-content" onclick="goToReadyRoom()">
            <h1 class="game-logo">ARCATDIA</h1>
            <p class="logo-sub">~ 太陽系全星際航行 ＆ 相簿幻燈片 ~</p>
            <div class="tap-start-hint">✨ 點擊螢幕進入航行整備室 ✨</div>
        </div>

        <div class="production-footer">
            <div class="prod-brand">Hei'dizai & P-chan Productions</div>
            <div class="prod-copy">© 2026 ARCATDIA PROJECT. ALL RIGHTS RESERVED.</div>
        </div>
    </div>

    <!-- 🎯 畫面二：出發準備室 (Ready Room 候機室) -->
    <div id="readyRoom" class="overlay-modal glass-panel">
        <button class="btn-drawer-toggle" onclick="toggleWallpaperDrawer()">🎨 相簿與設定</button>
        <h2 class="room-title">🚀 航行整備室</h2>
        
        <div class="ready-panel glass-card">
            <div class="setting-group">
                <label>選擇航行難度：</label>
                <div class="option-row">
                    <button class="opt-btn diff-btn active" id="btnDiffEasy" onclick="selectDifficulty('easy')">🌱 EASY</button>
                    <button class="opt-btn diff-btn" id="btnDiffNormal" onclick="selectDifficulty('normal')">🔥 NORMAL</button>
                    <button class="opt-btn diff-btn" id="btnDiffTest" onclick="selectDifficulty('test')">🛠️ TEST</button>
                </div>
            </div>

            <div class="setting-group">
                <label>音符下落流速：</label>
                <div class="option-row">
                    <button class="opt-btn speed-btn" onclick="setSpeed(0.5)">0.5x</button>
                    <button class="opt-btn speed-btn" onclick="setSpeed(0.7)">0.7x</button>
                    <button class="opt-btn speed-btn active" onclick="setSpeed(1.0)">1.0x</button>
                    <button class="opt-btn speed-btn" onclick="setSpeed(1.2)">1.2x</button>
                </div>
            </div>

            <button class="launch-btn" onclick="startVoyage()">✨ 啟程前往阿卡迪亞貓星 ✨</button>
        </div>
    </div>

    <!-- 🎯 隨身抽屜：多張幻燈片相簿上載 (Wallpaper Drawer) -->
    <div id="wallpaperDrawer" class="drawer-modal">
        <div class="drawer-header">
            <h3>🎨 相簿與質感設定</h3>
            <button class="btn-close-drawer" onclick="toggleWallpaperDrawer()">✕</button>
        </div>
        <div class="drawer-body">
            <label>📸 多張相片幻燈片上載 (最多12張)：</label>
            <label class="custom-upload-btn">
                📁 選擇多張相片 (每5.5秒輪播)...
                <input type="file" id="customImgInput" accept="image/*" multiple onchange="handleCustomWallpaperUpload(event)" style="display:none;">
            </label>

            <label style="margin-top: 14px;">磨砂玻璃透光度：</label>
            <div class="slider-row">
                <input type="range" id="glassOpacitySlider" min="0" max="100" value="65" oninput="updateGlassOpacity(this.value)">
                <span id="glassOpacityVal">65%</span>
            </div>
        </div>
    </div>

    <!-- 🎯 戰鬥暫停選單 (Pause Menu) -->
    <div id="pauseMenu" class="overlay-modal glass-panel">
        <div class="pause-card glass-card">
            <h2>⏸ 遊戲暫停中</h2>
            <button class="pause-opt-btn" onclick="resumeGame()">▶ 繼續戰鬥</button>
            <button class="pause-opt-btn" onclick="toggleWallpaperDrawer()">🎨 相簿與設定</button>
            <button class="pause-opt-btn" onclick="restartFromPause()">🔄 重新開始</button>
            <button class="pause-opt-btn btn-exit" onclick="returnToReadyRoom()">🚪 退回航行整備室</button>
        </div>
    </div>
</div>

<script src="app.js"></script>
</body>
</html>
